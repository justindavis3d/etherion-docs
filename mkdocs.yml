site_name: Etherion Foliage Plugin Documentation

theme:
  name: material
  logo: assets/logo.svg
  palette:
    scheme: slate
    primary: green
    accent: violet
  features:
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list

plugins:
  - search
  - awesome-pages
  - ezlinks:
      wikilinks: true
  - autorefs
  
extra_css:
  - stylesheets/extra.css