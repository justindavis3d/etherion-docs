site_name: Etherion Foliage Plugin Documentation

theme:
  name: material
  logo: assets/logoicon.svg
  favicon: assets/favicon.ico
  palette:
    scheme: slate
    primary: green
    accent: purple
  features:
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list

plugins:
  - search
  - awesome-pages
  - ezlinks:
      wikilinks: true
  - autorefs
  - glightbox
  
extra_css:
  - stylesheets/extra.css
  
extra_javascript:
  - javascript/extra.js