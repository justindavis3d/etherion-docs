site_name: Etherion Designs Documentation

theme:
  name: material
  logo: assets/logoicon.svg
  favicon: assets/favicon.ico
  palette:
    scheme: slate
    primary: green
    accent: purple
  features:
    - content.code.copy
    - navigation.tabs

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list
  - admonition
  - pymdownx.details

plugins:
  - search
  - awesome-pages
  - ezlinks:
      wikilinks: true
  - autorefs
  - glightbox
  - callouts
  
extra_css:
  - stylesheets/extra.css
  
extra_javascript:
  - javascript/extra.js
